<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCOM - Registrar Vehículo</title>
    <!-- Estilos locales de Bootstrap -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <!-- CORREGIDO: Enlace oficial completo de los iconos de Bootstrap -->
   <link rel="stylesheet" href="css/bootstrap-icons.min.css">


    <style>
        .navbar-custom { background-color: #1e293b; }
    </style>
</head>

<body class="bg-light">

    <!-- BARRA SUPERIOR DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="dashboard.html"><i class="bi bi-shield-lock-fill me-2"></i>PROCOM <span class="fw-light text-muted">| Flotillas</span></a>
            <a href="dashboard.html" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i> Volver al Panel</a>
        </div>
    </nav>

    <!-- CONTENEDOR DEL FORMULARIO -->
    <div class="container px-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8">
                
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3">
                        <h5 class="m-0 fw-bold text-primary"><i class="bi bi-car-front-fill me-2"></i>Alta de Nuevo Vehículo</h5>
                    </div>
                    <div class="card-body p-4">
                        <!-- Al dar clic en guardar, simulará el retorno al panel principal -->
                        <form action="dashboard.html">
                            
                            <!-- SECCIÓN 1: DATOS GENERALES -->
                            <h6 class="text-primary fw-bold mb-3"><i class="bi bi-info-circle-fill me-2"></i>1. Información General</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-12 col-sm-6">
                                    <label class="form-label small fw-bold text-secondary">Marca / Modelo</label>
                                    <input type="text" class="form-control" placeholder="Ej. Chevrolet Aveo" required>
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label class="form-label small fw-bold text-secondary">Año del Vehículo</label>
                                    <input type="number" class="form-control" placeholder="Ej. 2023" min="2010" max="2028" required>
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label class="form-label small fw-bold text-secondary">Placas</label>
                                    <input type="text" class="form-control text-uppercase" placeholder="Ej. XYZ123A" maxlength="10" required>
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label class="form-label small fw-bold text-secondary">Asignar Conductor Inicial</label>
                                    <select class="form-select" required>
                                        <option value="" selected disabled>Selecciona un chofer...</option>
                                        <option value="1">Carlos Mendoza</option>
                                        <option value="2">Jorge Gómez</option>
                                        <option value="3">Sin conductor asignado</option>
                                    </select>
                                </div>
                            </div>

                            <!-- SECCIÓN 2: TRÁMITES LEGALES Y VERIFICACIÓN -->
                            <h6 class="text-primary fw-bold mb-3"><i class="bi bi-calendar-check-fill me-2"></i>2. Trámites Legales</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-12 col-sm-6">
                                    <label class="form-label small fw-bold text-secondary">Engomado (Período de Verificación)</label>
                                    <select class="form-select" required>
                                        <option value="" selected disabled>Selecciona el engomado...</option>
                                        <option value="amarillo">Amarillo (Placas 5 y 6)</option>
                                        <option value="rosa">Rosa (Placas 7 y 8)</option>
                                        <option value="rojo">Rojo (Placas 3 y 4)</option>
                                        <option value="verde">Verde (Placas 1 y 2)</option>
                                        <option value="azul">Azul (Placas 9 y 0)</option>
                                    </select>
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label class="form-label small fw-bold text-secondary">Vencimiento del Seguro Vehicular</label>
                                    <input type="date" class="form-control" required>
                                </div>
                            </div>

                            <!-- SECCIÓN 3: MANTENIMIENTO PREVENTIVO -->
                            <h6 class="text-primary fw-bold mb-3"><i class="bi bi-wrench-adjustable me-2"></i>3. Mantenimiento Preventivo</h6>
                            <div class="row g-3 mb-4">
                                <div class="col-12 col-sm-4">
                                    <label class="form-label small fw-bold text-secondary">Kilometraje Actual</label>
                                    <input type="number" class="form-control" placeholder="Ej. 45000" min="0" required>
                                </div>
                                <div class="col-12 col-sm-4">
                                    <label class="form-label small fw-bold text-secondary">Último Cambio de Aceite (km)</label>
                                    <input type="number" class="form-control" placeholder="Ej. 40000" min="0" required>
                                </div>
                                <div class="col-12 col-sm-4">
                                    <label class="form-label small fw-bold text-secondary">Frecuencia de Servicio</label>
                                    <select class="form-select" required>
                                        <option value="5000">Cada 5,000 km</option>
                                        <option value="10000" selected>Cada 10,000 km</option>
                                        <option value="15000">Cada 15,000 km</option>
                                    </select>
                                </div>
                            </div>

                            <hr class="text-muted mb-4">

                            <!-- BOTONES DE ACCIÓN -->
                            <div class="d-flex justify-content-end gap-2">
                                <button type="reset" class="btn btn-light btn-sm px-4 border">Limpiar Campos</button>
                                <button type="submit" class="btn btn-success btn-sm px-4 shadow-sm"><i class="bi bi-check-circle me-1"></i> Guardar Vehículo</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
